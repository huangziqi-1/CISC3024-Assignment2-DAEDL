[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cisc3024-daedl"
version = "0.1.0"
description = "Reproducible CIFAR-10 Softmax and DAEDL experiments"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

